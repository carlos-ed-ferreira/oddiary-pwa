name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_FILE: compose.yaml:compose.ci.yaml
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare dependency caches and ownership
        id: runtime
        run: |
          mkdir -p storage/app/private/ci-cache/{composer,npm}
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/app/private/ci-cache
          key: dependencies-${{ runner.os }}-${{ hashFiles('docker/app/Dockerfile', 'composer.lock', 'package-lock.json') }}
          restore-keys: dependencies-${{ runner.os }}-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the pinned runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          push: false
          tags: oddiary-pwa-runtime:php8.4.24-node24.19.0
          build-args: |
            HOST_UID=${{ steps.runtime.outputs.uid }}
            HOST_GID=${{ steps.runtime.outputs.gid }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Install locked dependencies and start the technical app
        run: make env install key up
      - name: Run required quality gates
        run: make quality
      - name: Stop local services
        if: always()
        run: docker compose --profile e2e --profile security down
